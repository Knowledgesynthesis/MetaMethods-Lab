<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Learn meta-analysis by doing: interactive labs for effect sizes, random-effects models, heterogeneity, rare events, proportions, meta-regression, publication bias, diagnostic accuracy, network and Bayesian meta-analysis — validated against R."
    />
    <meta name="theme-color" content="#0b1220" />
    <meta property="og:title" content="MetaMethods Lab" />
    <meta property="og:description" content="Interactive, validated course in meta-analysis methods." />
    <meta property="og:type" content="website" />
    <title>MetaMethods Lab — meta-analysis, learned by doing</title>
    <script>
      // Apply theme and font size before first paint (no flash)
      try {
        var s = JSON.parse(localStorage.getItem('metamethods-v2') || '{}').state || {}
        var t = s.theme || 'system'
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.dataset.font = s.fontSize || 'md'
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>MetaMethods Lab needs JavaScript for its interactive labs.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
